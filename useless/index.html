<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Exit Is Right There</title>
  <meta name="description" content="A ragebait escape room where the exit is right there. Every door, drawer and lid is Aholo Lux3D articulation." />
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <header>
    <h1 data-t="title">The Exit Is Right There</h1>
    <p class="sub" data-t="sub">Goal: leave the room. That's it.</p>
  </header>
  <div class="timer"><span data-t="wasted">Time wasted</span> <b id="time">0:00</b></div>
  <div id="key" class="keybadge hidden">🔑</div>

  <div id="say" class="say"><span class="who" data-t="oracle">THE ORACLE</span><span id="sayText"></span></div>
  <div id="task" class="task hidden"></div>

  <div id="captcha" class="captcha hidden">
    <div class="capHead">☑ <span data-t="capTitle">Prove you are not a robot</span></div>
    <div class="capBody"><span data-t="capText">Open every object that opens.</span> <b id="capN">0/8</b></div>
  </div>

  <div id="quiz" class="quiz hidden">
    <div class="who" data-t="oracle">THE ORACLE</div>
    <div id="quizQ" class="q"></div>
    <div id="quizA" class="a"></div>
  </div>

  <button id="startBtn" class="start hidden" data-t="start">Enter the room</button>

  <footer>
    <div class="row">
      <button id="lang" class="mini">中文</button>
      <button id="mute" class="mini">🔊</button>
      <button id="about" class="mini" data-t="aboutBtn">How it was made</button>
    </div>
  </footer>

  <div id="fade" class="fade"></div>
  <div id="end" class="panel end hidden">
    <div class="card">
      <h2 data-t="endTitle">You escaped!</h2>
      <p class="endSub" data-t="endSub">Into a wardrobe.</p>
      <div class="stats3">
        <div><b id="endTime">0:00</b><span data-t="endTimeL">Time wasted</span></div>
        <div><b id="endDoors">0</b><span data-t="endDoorsL">Things opened</span></div>
        <div><b>0</b><span data-t="endWisdomL">Wisdom gained</span></div>
      </div>
      <p id="endLine" class="endLine"></p>
      <div class="row"><button id="share" class="mini big" data-t="share">Share my shame</button><button id="again" class="mini big" data-t="again">Again (why?)</button></div>
    </div>
  </div>

  <div id="loading" class="loading"><div class="bar"><i id="prog"></i></div><p data-t="loading">Building a room you cannot leave…</p></div>
  <div id="aboutPanel" class="panel hidden">
    <div class="card">
      <h2 data-t="aboutTitle">How it was made</h2>
      <p data-t="about1"></p>
      <p data-t="about2"></p>
      <p class="fine" data-t="about3"></p>
      <button id="closeAbout" class="mini" data-t="close">Close</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
