<!doctype html>
<html lang="en"
  data-composition-variables='[{"id":"playUrl","type":"string","label":"Play link","default":"rummage-game.vercel.app"},{"id":"repoUrl","type":"string","label":"Source link","default":"github.com/emmaGH1/rummage"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1d2a9e; }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: #1d2a9e; }
      video.footage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
      /* studio shots: the model sits right of centre so the step card has room on the left */
      .shift { position: absolute; inset: 0; transform: translateX(240px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- real gameplay footage, recorded frame by frame from the live build (tools/video/capture.mjs, edit.json) -->
      <video id="v-hook" class="clip footage" src="assets/footage/hook.mp4" data-start="0" data-duration="7" data-media-start="0" data-track-index="1" muted playsinline style="z-index:1"></video>
      <div class="shift" style="z-index:1">
        <video id="v-turn" class="clip footage" src="assets/footage/studio_turn.mp4" data-start="10.5" data-duration="8" data-media-start="0" data-track-index="1" muted playsinline></video>
        <video id="v-explode" class="clip footage" src="assets/footage/studio_explode.mp4" data-start="18.5" data-duration="9" data-media-start="0" data-track-index="1" muted playsinline></video>
      </div>
      <video id="v-room" class="clip footage" src="assets/footage/in_room.mp4" data-start="27.5" data-duration="6" data-media-start="0" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-pirate" class="clip footage" src="assets/footage/room_pirate.mp4" data-start="33.5" data-duration="2.5" data-media-start="0.1" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-kitchen" class="clip footage" src="assets/footage/room_kitchen.mp4" data-start="36" data-duration="2.5" data-media-start="0.1" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-workshop" class="clip footage" src="assets/footage/room_workshop.mp4" data-start="38.5" data-duration="2.5" data-media-start="0.1" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-wizard" class="clip footage" src="assets/footage/room_wizard.mp4" data-start="41" data-duration="2.5" data-media-start="0.1" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-decoy" class="clip footage" src="assets/footage/decoy.mp4" data-start="43.5" data-duration="4.3" data-media-start="0.2" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-padlock" class="clip footage" src="assets/footage/padlock.mp4" data-start="47.8" data-duration="6.4" data-media-start="0.2" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-mimic" class="clip footage" src="assets/footage/mimic.mp4" data-start="54.2" data-duration="3.4" data-media-start="0.2" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-night" class="clip footage" src="assets/footage/night.mp4" data-start="57.6" data-duration="7.5" data-media-start="0.5" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-hintbet" class="clip footage" src="assets/footage/hint_bet.mp4" data-start="65.1" data-duration="8.7" data-media-start="0.3" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-hurry" class="clip footage" src="assets/footage/hurry.mp4" data-start="73.8" data-duration="3.8" data-media-start="0.2" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-win" class="clip footage" src="assets/footage/win.mp4" data-start="77.6" data-duration="5.4" data-media-start="0.6" data-track-index="1" muted playsinline style="z-index:1"></video>

      <!-- overlays, one scene per beat -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="question" data-composition-id="question" data-composition-src="compositions/question.html" data-start="7" data-duration="3.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="prompt" data-composition-id="prompt" data-composition-src="compositions/prompt.html" data-start="10.5" data-duration="8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="joints" data-composition-id="joints" data-composition-src="compositions/joints.html" data-start="18.5" data-duration="9" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="inroom" data-composition-id="inroom" data-composition-src="compositions/inroom.html" data-start="27.5" data-duration="6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="numbers" data-composition-id="numbers" data-composition-src="compositions/numbers.html" data-start="33.5" data-duration="10" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="play" data-composition-id="play" data-composition-src="compositions/play.html" data-start="43.5" data-duration="39.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="83" data-duration="7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>

      <!-- soundtrack: the game's own music and sound effects, rendered offline (tools/video/render_audio.mjs) -->
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="90" data-track-index="3" data-volume="0.8"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="90" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
